<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="shipped.beekley.dev — apps people use, systems that stay up. Web, iOS, and infrastructure, each one live."
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fafafa"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#18181b"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="shipped.beekley.dev" />
    <meta
      property="og:description"
      content="Apps people use, systems that stay up, proof you can click. Web, iOS, and infrastructure — each one live."
    />
    <meta property="og:url" content="https://shipped.beekley.dev/" />
    <meta
      property="og:image"
      content="https://shipped.beekley.dev/og-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="shipped: apps people use, systems that stay up. shipped.beekley.dev — web, iOS, infrastructure."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://shipped.beekley.dev/" />
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="stylesheet" href="/src/App.css" />
    <title>shipped.beekley.dev</title>
    <!--
      Plausible, served from this domain rather than plausible.io (CloudFront
      proxies /js/ and /api/event upstream). Same-origin, so the CSP stays at
      script-src 'self' and there is no third-party host for a blocker to
      match. The outbound-links build is deliberate: the point of this site is
      the clicks that leave it, for the App Store and the live apps.
    -->
    <script
      defer
      data-domain="shipped.beekley.dev"
      src="/js/script.outbound-links.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
  </body>

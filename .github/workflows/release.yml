name: Release

# Every push to main is a release candidate: the CI pipeline builds and tests
# one artifact, the build is tagged vMAJOR.MINOR.BUILD, and deploy jobs
# promote that exact artifact — build once, deploy everywhere. MAJOR.MINOR
# comes from package.json's version; the build number is the workflow run
# number, so every build is uniquely and monotonically versioned.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false # never cancel an in-flight release

jobs:
  # Full CI pipeline (lint, typecheck, test, build) — produces the dist artifact.
  verify:
    uses: ./.github/workflows/ci.yml
    # A called workflow's jobs can only downgrade from this grant — the repo
    # default token is contents:read only, so without this the lint job's
    # pull-requests:read request is rejected and the run startup-fails.
    permissions:
      contents: read
      pull-requests: read

  version:
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: write # pushes the build tag
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute build version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      # Idempotent: a re-run reuses the run number, so skip if this build's
      # tag already exists rather than failing the release.
      - name: Tag the build
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

  deploy:
    runs-on: ubuntu-latest
    needs: [version]
    environment: production # requires manual approval — configure reviewers in repo Settings > Environments
    permissions:
      id-token: write # required for AWS OIDC
      contents: read
    steps:
      # Deploy the exact artifact the verify pipeline built and tested —
      # never rebuild here. The artifact is shared because verify runs via
      # workflow_call inside this same workflow run.
      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      # Cache lifetime follows fingerprinting, not file type. Only Vite's
      # dist/assets/** filenames carry a content hash, so only those can be
      # immutable — a new build emits a new name. Anything in public/ keeps
      # its name across builds (favicon.svg, robots.txt, …), so a year-long
      # max-age would pin a stale copy in browsers that a CloudFront
      # invalidation cannot reach. Do not collapse these back into one sync.
      #
      # Order matters: hashed assets first, index.html last, so the document
      # never references assets that are not uploaded yet.
      #
      # --delete stays safe because each sync's --exclude filters apply to
      # the delete scan too: the second sync will not remove assets/** or
      # index.html, and the first only prunes within assets/.
      - name: Sync build to S3
        env:
          BUCKET: s3://${{ secrets.S3_BUCKET }}
        run: |
          # 1. Content-hashed assets — immutable for a year.
          aws s3 sync dist/assets/ "$BUCKET/assets/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

          # 2. Unhashed static files (public/ passthrough) — short max-age so
          #    a replacement is picked up quickly after an invalidation.
          aws s3 sync dist/ "$BUCKET" \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=300"

          # 3. index.html must never be cached so new deploys are picked up
          #    immediately.
          aws s3 cp dist/index.html "$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

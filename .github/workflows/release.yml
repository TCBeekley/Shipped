name: Release

# Every push to main is a release candidate: the CI pipeline builds and tests
# one artifact, the build is tagged vMAJOR.MINOR.BUILD, and deploy jobs
# promote that exact artifact — build once, deploy everywhere. MAJOR.MINOR
# comes from package.json's version; the build number is the workflow run
# number, so every build is uniquely and monotonically versioned.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false # never cancel an in-flight release

jobs:
  # Full CI pipeline (lint, typecheck, test, build) — produces the dist artifact.
  verify:
    uses: ./.github/workflows/ci.yml
    # A called workflow's jobs can only downgrade from this grant — the repo
    # default token is contents:read only, so without this the lint job's
    # pull-requests:read request is rejected and the run startup-fails.
    permissions:
      contents: read
      pull-requests: read

  version:
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: write # pushes the build tag
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute build version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      # Idempotent: a re-run reuses the run number, so skip if this build's
      # tag already exists rather than failing the release.
      - name: Tag the build
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

  deploy:
    runs-on: ubuntu-latest
    needs: [version]
    environment: production # requires manual approval — configure reviewers in repo Settings > Environments
    permissions:
      id-token: write # required for AWS OIDC
      contents: read
    steps:
      # Deploy the exact artifact the verify pipeline built and tested —
      # never rebuild here. The artifact is shared because verify runs via
      # workflow_call inside this same workflow run.
      - name: Download verified build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Sync build to S3
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html
          # index.html must never be cached so new deploys are picked up immediately.
          aws s3 cp dist/index.html "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

name: Infra CI

on:
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra-ci.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra-ci.yml']

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: infra

jobs:
  build-test-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      # Templates synth without credentials, but the stacks resolve their
      # account from the environment (see infra/lib/config.ts) and fail loudly
      # when it is absent. Supply the documentation-only id the unit tests use,
      # so CI validates structure without depending on a real account.
      - name: Synth (no AWS credentials needed)
        env:
          CDK_DEPLOY_ACCOUNT: '123456789012'
        run: npx cdk synth --quiet

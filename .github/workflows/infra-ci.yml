name: Infra CI

on:
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra-ci.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra-ci.yml']

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: infra

jobs:
  build-test-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Synth (no AWS credentials needed)
        run: npx cdk synth --quiet
